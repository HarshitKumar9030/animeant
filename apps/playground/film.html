<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Walking Upright · Animeant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/film.css" />
  </head>
  <body>
    <main class="film">
      <canvas id="gl" aria-label="Film"></canvas>
      <canvas id="captions" aria-hidden="true"></canvas>
      <div class="controls" id="controls">
        <button class="ctl ctl-play" id="play" type="button" aria-label="Pause" data-state="playing">
          <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>
          <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.9v10.2a.9.9 0 0 0 1.37.77l8.1-5.1a.9.9 0 0 0 0-1.54l-8.1-5.1A.9.9 0 0 0 4.5 2.9Z"/></svg>
        </button>
        <div class="timeline" id="timeline">
          <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek" />
          <div class="chapters" id="chapters" aria-hidden="true"></div>
        </div>
        <span class="time" id="time">0:00</span>
        <button class="ctl ctl-icon" id="sound" type="button" aria-pressed="false" aria-label="Sound on">
          <svg class="icon-muted" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path d="m10.5 6 3 4m0-4-3 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
          <svg class="icon-sound" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path d="M10.4 5.6a3.4 3.4 0 0 1 0 4.8M12.2 3.8a6 6 0 0 1 0 8.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button class="ctl ctl-text" id="record" type="button" aria-pressed="false">
          <span class="rec-dot" aria-hidden="true"></span>
          <span class="roll"><span>Record</span><span>Recording</span></span>
        </button>
        <a class="ctl ctl-text ctl-quiet" href="./3d.html">Playground</a>
      </div>
    </main>
    <script type="module" src="/src/film.ts"></script>
  </body>
</html>
